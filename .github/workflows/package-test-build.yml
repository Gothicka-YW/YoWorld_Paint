name: Package test build

on:
  push:
    branches:
      - agent/current-model-improvements

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Prepare extension folder
        shell: bash
        run: |
          mkdir -p package/YoWorld_Paint_Current_Model_Test
          rsync -a ./ package/YoWorld_Paint_Current_Model_Test/ \
            --exclude '.git/' \
            --exclude 'package/'

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoWorld_Paint_Current_Model_Test
          path: package/YoWorld_Paint_Current_Model_Test
          if-no-files-found: error
          retention-days: 14
